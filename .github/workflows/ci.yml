name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"

jobs:
  lint:
    name: fmt & clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -j 2 -- -D warnings

  test:
    name: test & doc-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace -j 2
      - name: cargo test doc
        run: cargo test --doc --workspace -j 2

  smoke:
    name: smoke (zero-i/o domain invariant)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: verify zero-I/O in kd-domain
        run: |
          set -euo pipefail
          if grep -rnE 'std::net|std::fs|tokio|std::process' crates/kd-domain/src; then
            echo "error: kd-domain must not use I/O" >&2
            exit 1
          fi
          echo "kd-domain zero-I/O invariant verified"

  specs:
    name: spec-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: run spec-check
        run: cargo run -p xtask -j 2 -- spec-check

  xtask-ci:
    name: xtask ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # .config/nextest.toml: retry once, run every test, write junit.
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # rustup installs the rust-toolchain.toml pin (rustfmt and clippy included).
      - name: toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: xtask-ci
          # The pinned tools `cargo xtask tools` builds into .tools/.
          cache-directories: .tools
          cache-on-failure: true
      - name: cargo xtask ci
        run: cargo xtask ci
