# CycloneDX SBOM for the workspace. Runs on the release branch.
# The SBOM is an artifact on every main push.
name: sbom

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: sbom
    runs-on: {group: ent-cygnus, labels: [cygnus]}  # hardened Kata ARC fleet
    container: harbor.unsigned.gg/platform/ci-rust-runner:v0.1.14@sha256:d73d3748c0f22e7386109d12b01ccdf7282b0f529aab2c629b4e5ed558d42bc1
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-cyclonedx
      - name: make sbom
        run: |
          set -euo pipefail
          make sbom
          mkdir -p sbom
          find . -name '*.cdx.json' -not -path './target/*' -not -path './sbom/*' -exec cp {} sbom/ \;
          ls -l sbom
          test -n "$(ls -A sbom)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
          if-no-files-found: error
          retention-days: 90
