# Reusable Rust gate. Callers: ci.yml (job `rust`). Spec: specs/0005-ci-cache-and-runners.md.
#
# The Makefile is the single source of commands: this workflow runs `make ci`,
# never its own cargo invocations, so CI and a workstation cannot drift.
#
# Runner facts (action-runners origin/main@39a10ee, read 2026-10-08):
# - lane `ci-rust` bakes Rust 1.94.1 (= rust-toolchain.toml), rustfmt, clippy,
#   cargo-deny 0.19.9 and typos 1.49; RUSTUP_HOME is READ-ONLY to the runner user,
#   so this workflow never installs a toolchain (a toolchain action would fail).
# - pods are ephemeral with no volumes: cross-job Rust compilation caching uses
#   kache backed by GitHub Actions cache.
# - pod CPU throttling enforces JOBS=2 (aligned with host and open source CI).
name: rust (reusable)

on:
  workflow_call:
    inputs:
      jobs:
        description: "Cargo build jobs (make JOBS=)."
        type: number
        default: 2
      nextest-profile:
        description: "nextest profile (see .config/nextest.toml)."
        type: string
        default: ci

permissions:
  contents: read

jobs:
  cargo:
    name: cargo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: toolchain (baked, verified)
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Rust build cache (kache)
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v2.0.0
        with:
          version: "2.0.0"
          cache-executables: "false"
          github-cache: "true"
          manifest-key: rust-cargo
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest

      - name: make ci
        run: make ci JOBS=${{ inputs.jobs }} NEXTEST_PROFILE=${{ inputs.nextest-profile }}

      - name: junit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/nextest/${{ inputs.nextest-profile }}/junit.xml
          if-no-files-found: ignore
          retention-days: 14
